<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <title>Wimoor 中文说明文档</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232563eb'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-size='28' fill='white' font-family='Arial'%3EW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #2563eb;
      --sidebar-width: 300px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .markdown-section {
      max-width: 1120px;
      padding: 32px 40px;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section pre,
    .markdown-section code {
      font-family: "Cascadia Code", Consolas, "Liberation Mono", monospace;
    }

    .mermaid {
      margin: 20px 0;
      padding: 16px;
      overflow-x: auto;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }

    .sidebar ul li a {
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>
  <script>
    function resolveDocsBasePath() {
      var path = window.location.pathname || '/';
      path = path.replace(/index\.html$/i, '');
      if (path.charAt(path.length - 1) !== '/') {
        path += '/';
      }
      path = path.replace(/\/zh-cn\/$/i, '/');
      return path + 'zh-cn/';
    }

    function normalizeLegacyHashRoutes() {
      var hash = window.location.hash || '';
      if (/^#\/(?:\.\.\/)+README(?:\.md)?$/i.test(hash)) {
        window.location.replace(window.location.pathname + window.location.search + '#/README');
      }
    }

    normalizeLegacyHashRoutes();
    window.addEventListener('hashchange', normalizeLegacyHashRoutes);

    window.$docsify = {
      name: 'Wimoor 中文说明文档',
      basePath: resolveDocsBasePath(),
      homepage: 'README.md',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: false,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '搜索文档',
        noData: '没有找到结果',
        depth: 4
      },
      copyCode: {
        buttonText: '复制',
        errorText: '复制失败',
        successText: '已复制'
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var blocks = document.querySelectorAll('pre[data-lang="mermaid"] code, code.lang-mermaid, code.language-mermaid');
            blocks.forEach(function (block) {
              var pre = block.closest('pre');
              if (!pre || pre.dataset.rendered === 'true') {
                return;
              }
              var graph = document.createElement('div');
              graph.className = 'mermaid';
              graph.textContent = block.textContent;
              pre.dataset.rendered = 'true';
              pre.parentNode.replaceChild(graph, pre);
            });

            if (window.mermaid) {
              window.mermaid.initialize({
                startOnLoad: false,
                securityLevel: 'loose',
                theme: 'default'
              });
              window.mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2/dist/docsify-copy-code.min.js"></script>
</body>
</html>
