server:
  port: 8106
  servlet:
    context-path: /ozon
spring:
  application:
    name: wimoor-ozon
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: prod
      config:
        server-addr: ${spring.cloud.nacos.discovery.server-addr}
        namespace: prod
        file-extension: yaml
        shared-configs[0]:
          data-id: wimoor-common
          refresh: true
        shared-configs[1]:
          data-id: wimoor-commom-ext
          refresh: true
